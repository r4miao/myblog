<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Content - Tyrannus' Hall</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            color: #f8f8f8;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
        }

        body {
            background: url('../img/bible2.jpg') 
                        no-repeat center bottom fixed;
            background-size: cover;
            background-color: rgba(0,0,0,0.7);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Centered overlay container */
        .overlay {
            background-color: rgba(0, 0, 0, 0);
            width: 95%;
            max-width: 1500px;
            min-height: 100vh;
            padding: 80px 60px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0);
            backdrop-filter: blur(3px);
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Desktop: Large screens (1200px and above) */
        @media (min-width: 1200px) {
            .overlay {
                width: 60%;
                max-width: 1200px;
                padding: 80px 60px;
            }
        }

        /* Laptop: Medium screens (768px to 1199px) */
        @media (min-width: 768px) and (max-width: 1199px) {
            .overlay {
                width: 85%;
                max-width: 850px;
                padding: 70px 50px;
            }
        }

        .content {
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .article-list {
            margin-top: 40px;
            font-size: 1.2rem;
        }

        .article-list ul {
            list-style: none;
            padding: 0;
        }

        .article-list li {
            margin: 15px 0;
        }

        .article-list a {
            color: #f8f8f8;
            text-decoration: none;
            border-bottom: 1px solid rgba(248,248,248,0.4);
            padding-bottom: 4px;
            transition: border-color 0.3s;
            font-size: 1.3rem;
        }

        .article-list a:hover {
            border-color: #f8f8f8;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 30px;
            background-color: rgba(0, 0, 0, 0.4);
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            font-size: 1rem;
            z-index: 10;
            transition: background-color 0.3s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .back-link:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        /* Custom transparent scrollbar */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            border: 4px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
            border: 4px solid transparent;
            background-clip: padding-box;
        }
        * { scrollbar-color: rgba(255, 255, 255, 0.3) transparent; scrollbar-width: thin; }

        /* Cell phone: Small screens (below 768px) */
        @media (max-width: 767px) {
            .overlay {
                width: 98%;
                padding: 50px 20px;
            }
            h1 { 
                font-size: 2rem; 
                margin-bottom: 20px;
            }
            .article-list {
                margin-top: 30px;
                font-size: 1.1rem;
            }
            .article-list a {
                font-size: 1.2rem;
            }
            .article-list li {
                margin: 10px 0;
            }
            .back-link {
                font-size: 0.9rem;
                padding: 8px 15px;
                left: 15px;
                top: 15px;
            }
        }
    </style>
</head>
