<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyrannus’ Hall</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            color: #f8f8f8;                  /* Soft off-white text */
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7);  /* Gentle shadow for readability */
        }

        body {
            /* Replace with your own local image if desired */
            background: url('img/bible2.jpg') 
                        no-repeat center bottom fixed;
            background-size: cover;
            background-color: rgba(0,0,0,0.7);       /* Dark fallback for any empty areas */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;     /* Content starts from the top */
            align-items: center;
            position: relative;
        }

        .content {
            width: 95%;
            max-width: 1500px;
            padding: 40px 60px;
            box-sizing: border-box;
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: 3.2rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .quotes {
            font-size: 1.3rem;
            line-height: 1.4;
            margin: 30px auto;
            max-width: 900px;
            font-style: italic;
        }

        .quotes p {
            margin-bottom: 15px;
        }

        .quotes cite {
            display: block;
            font-style: normal;
            font-size: 1rem;
            margin-top: 5px;
            opacity: 0.9;
        }

        .article-list {
            margin-top: 40px;
            font-size: 1.2rem;
        }

        .article-list ul {
            list-style: none;
            padding: 0;
        }

        .article-list li {
            margin: 15px 0;
        }

        .article-list a {
            color: #f8f8f8;
            text-decoration: none;
            border-bottom: 1px solid rgba(248,248,248,0.4);
            padding-bottom: 4px;
            transition: border-color 0.3s;
        }

        .article-list a:hover {
            border-color: #f8f8f8;
        }

        /* Custom transparent scrollbar (kept for consistency) */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            border: 4px solid transparent;
            background-clip: padding-box;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
            border: 4px solid transparent;
            background-clip: padding-box;
        }
        * { scrollbar-color: rgba(255, 255, 255, 0.3) transparent; scrollbar-width: thin; }

        @media (max-width: 800px) {
            .content { padding: 30px 20px; }
            h1 { 
                font-size: 2.2rem; 
                margin-bottom: 20px;
            }
            .quotes { 
                font-size: 1.1rem; 
                line-height: 1.3;
                margin: 20px auto;
            }
            .quotes p {
                margin-bottom: 10px;
            }
            .article-list {
                margin-top: 30px;
                font-size: 1.1rem;
            }
            .article-list li {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>School of Tyrannus</h1>

        <div class="quotes">

	    <p>“For we walk by faith, not by sight.”</p>
            <cite>— 2 Corinthians 5:7</cite><br>

            <p>“Understanding is the reward of faith. Therefore seek not to understand that you may believe, but believe that you may understand.”</p>
            <cite>— St. Augustine of Hippo</cite><br>
 
        </div>

        <div class="article-list">
            <ul>
                <li><a href="blog/content.html">Read</a></li>
                <!-- Add more articles here -->
            </ul>
        </div>
    </div>

</body>
</html>
